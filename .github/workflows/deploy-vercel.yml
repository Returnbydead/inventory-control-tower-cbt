name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Pull Vercel production settings
        run: npx --yes vercel@57.0.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifact
        run: npx --yes vercel@57.0.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production artifact
        run: npx --yes vercel@57.0.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
